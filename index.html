<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Weather App</title>

    <style>
        body {
            background: url("background.png") center/cover no-repeat fixed;
            min-height: 100vh;
        }

        .weather {
            background: #ffffffb8;
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 25px;
            color: #123b68;
        }



        #temperature {
            font-size: 60px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="weather text-center">
        <h2 class="text-primary">🌤️Weather App</h2>

        <input type="text" id="city" class="form-control my-3" placeholder="Enter city name">

        <button onclick="getWeather()" class="btn btn-primary w-100">Check</button>

        <img id="icon" width="100">
        <h3 id="cityName"></h3>
        <h1 id="temperature"></h1>
        <h5 id="description"></h5>

        <hr>

        <p id="details"></p>
    </div>

    <script>
        async function getWeather() {
            try {
                const city = document.getElementById("city").value;

                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`);

                const data = await response.json();

                if (!response.ok) {
                    alert("Please enter a city name!!");
                    return;
                }
                cityName.innerHTML = data.name;
                temperature.innerHTML = data.main.temp + "°C";
                description.innerHTML = data.weather[0].description;
                icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                details.innerHTML = "💧 Humidity: " + data.main.humidity + "% | " + "💨 Wind: " + data.wind.speed + " m/s";

            } catch (error) {
                console.log(error);
            }
        }
    </script>

</body>

</html>
